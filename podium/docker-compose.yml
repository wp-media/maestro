version: '3.8'

services:
  podium:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PODIUM_PORT:-7337}:7337"
    volumes:
      # Mount the host TEMP_ROOT (read-only) so Podium can read event files.
      # Override MAESTRO_TEMP_ROOT in a .env file or shell env if needed.
      - ${MAESTRO_TEMP_ROOT:-.maestro}:/data/maestro:ro
    environment:
      - TEMP_ROOT=/data/maestro
      - PORT=7337
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7337/health"]
      interval: 30s
      timeout: 5s
      retries: 3
